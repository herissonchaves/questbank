server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Charset padrão
    charset utf-8;

    # Tipos MIME extras (garante que .jsx seja servido corretamente pelo Babel Standalone)
    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js jsx mjs;
        application/json                      json;
        application/manifest+json             webmanifest;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        font/woff                             woff;
        font/woff2                            woff2;
        application/octet-stream             bin;
    }

    # Cache para assets estáticos (JS, CSS, imagens)
    location ~* \.(js|jsx|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        # Permite cross-origin para o Babel Standalone buscar os .jsx
        add_header Access-Control-Allow-Origin "*";
    }

    # Service Worker — sem cache (precisa sempre verificar atualização)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Manifest PWA
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Proxy reverso para o servidor LaTeX Python (latex2questbank)
    location /latex/ {
        proxy_pass         http://latex-server:8765/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Proxy reverso para o backend Node.js (API REST)
    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 50m;
    }

    # Rota principal — serve index.html para qualquer path (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compressão gzip para economizar banda
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Oculta versão do nginx por segurança
    server_tokens off;
}
